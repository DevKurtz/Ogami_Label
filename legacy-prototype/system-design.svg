<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1050" viewBox="0 0 1600 1050">
<defs><filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#172033" flood-opacity=".10"/></filter></defs>
<rect width="1600" height="1050" fill="#f3f6fa"/><rect width="1600" height="76" fill="#fff"/><text x="42" y="48" font-family="Arial" font-size="25" font-weight="700" fill="#142033">OGAMI<tspan fill="#3274e8"> LABEL STUDIO</tspan></text><text x="390" y="47" font-family="Arial" font-size="15" fill="#68758b">Excel to print-ready labels</text><rect x="1370" y="20" width="185" height="38" rx="9" fill="#eff4fb"/><circle cx="1392" cy="39" r="7" fill="#38a47a"/><text x="1408" y="44" font-family="Arial" font-size="13" fill="#39465a">Workspace ready</text>
<text x="42" y="132" font-family="Arial" font-size="30" font-weight="700" fill="#172338">Turn spreadsheet rows into labels</text><text x="42" y="162" font-family="Arial" font-size="15" fill="#68758b">Upload a workbook, review each record, then print consistent QR-coded labels.</text>
<rect x="42" y="190" width="1516" height="72" rx="14" fill="#fff" filter="url(#shadow)"/><circle cx="77" cy="226" r="18" fill="#3274e8"/><text x="72" y="232" font-family="Arial" font-size="15" font-weight="700" fill="#fff">1</text><text x="108" y="222" font-family="Arial" font-size="15" font-weight="700" fill="#1c2a3e">Upload Excel</text><text x="108" y="243" font-family="Arial" font-size="12" fill="#738097">Choose file and map columns</text><path d="M335 226h40" stroke="#c6cfdb" stroke-width="2"/><circle cx="410" cy="226" r="18" fill="#3274e8"/><text x="405" y="232" font-family="Arial" font-size="15" font-weight="700" fill="#fff">2</text><text x="441" y="222" font-family="Arial" font-size="15" font-weight="700" fill="#1c2a3e">Review records</text><text x="441" y="243" font-family="Arial" font-size="12" fill="#738097">Open first row and verify data</text><path d="M680 226h40" stroke="#c6cfdb" stroke-width="2"/><circle cx="755" cy="226" r="18" fill="#dbe5f3"/><text x="750" y="232" font-family="Arial" font-size="15" font-weight="700" fill="#5b6980">3</text><text x="786" y="222" font-family="Arial" font-size="15" font-weight="700" fill="#1c2a3e">Generate &amp; print</text><text x="786" y="243" font-family="Arial" font-size="12" fill="#738097">One image per row, QR included</text>
<rect x="42" y="286" width="405" height="704" rx="15" fill="#fff" filter="url(#shadow)"/><text x="68" y="330" font-family="Arial" font-size="19" font-weight="700" fill="#172338">Import workbook</text><text x="68" y="356" font-family="Arial" font-size="13" fill="#748197">Start with your Excel data file</text><rect x="68" y="379" width="353" height="166" rx="12" fill="#f7faff" stroke="#93b5ef" stroke-width="2" stroke-dasharray="8 6"/><rect x="221" y="408" width="48" height="48" rx="12" fill="#e5efff"/><path d="M245 443v-22m-8 8 8-8 8 8M232 449v5h26v-5" fill="none" stroke="#3274e8" stroke-width="2.5"/><text x="141" y="481" font-family="Arial" font-size="14" font-weight="700" fill="#26364d">Drop your Excel file here</text><text x="178" y="503" font-family="Arial" font-size="12" fill="#8490a2">or browse files · .xlsx, .xls, .csv</text><rect x="68" y="565" width="353" height="67" rx="10" fill="#f3f7fb"/><rect x="83" y="581" width="34" height="36" rx="5" fill="#e6f5ec"/><text x="91" y="605" font-family="Arial" font-size="11" font-weight="700" fill="#258354">XLS</text><text x="130" y="590" font-family="Arial" font-size="13" font-weight="700" fill="#26364d">ogami_parts_nov.xlsx</text><text x="130" y="612" font-family="Arial" font-size="11" fill="#7d899b">6 records · Sheet1</text><circle cx="399" cy="598" r="9" fill="#38a47a"/><path d="m395 598 3 3 6-7" fill="none" stroke="white" stroke-width="2"/><text x="68" y="674" font-family="Arial" font-size="15" font-weight="700" fill="#253349">Column mapping</text><text x="68" y="697" font-family="Arial" font-size="12" fill="#758197">Match spreadsheet fields to label fields</text>
<text xmlns="http://www.w3.org/2000/svg" x="68" y="730" font-family="Arial" font-size="12" fill="#516078">Part number</text><rect xmlns="http://www.w3.org/2000/svg" x="68" y="741" width="353" height="37" rx="7" fill="#fff" stroke="#d8e0ea"/><text xmlns="http://www.w3.org/2000/svg" x="82" y="765" font-family="Arial" font-size="12" fill="#26364d">PART NUMBER①</text><path d="M399 756l5 5 5-5" fill="none" stroke="#718096" stroke-width="1.5"/><text xmlns="http://www.w3.org/2000/svg" x="68" y="807" font-family="Arial" font-size="12" fill="#516078">Serial number</text><rect xmlns="http://www.w3.org/2000/svg" x="68" y="818" width="353" height="37" rx="7" fill="#fff" stroke="#d8e0ea"/><text xmlns="http://www.w3.org/2000/svg" x="82" y="842" font-family="Arial" font-size="12" fill="#26364d">SERIAL NO.</text><path d="M399 833l5 5 5-5" fill="none" stroke="#718096" stroke-width="1.5"/><text xmlns="http://www.w3.org/2000/svg" x="68" y="884" font-family="Arial" font-size="12" fill="#516078">QR code content</text><rect xmlns="http://www.w3.org/2000/svg" x="68" y="895" width="353" height="37" rx="7" fill="#fff" stroke="#d8e0ea"/><text xmlns="http://www.w3.org/2000/svg" x="82" y="919" font-family="Arial" font-size="12" fill="#26364d">QR CODE</text><path d="M399 910l5 5 5-5" fill="none" stroke="#718096" stroke-width="1.5"/>
</svg>